<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$title. An open standard for evidence records of AI agents and automated workflows.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #fbfaf7; --surface: #f2efe8; --text: #1b2a41; --muted: #5a6577;
  --border: #ddd8cc; --accent: #e0a100; --link: #1b2a41; --code: #efebe2;
  --draft-bg: #fbeec4; --draft-text: #6b4c00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161f; --surface: #182030; --text: #e8e4da; --muted: #9aa3b2;
    --border: #2a3342; --accent: #e0a100; --link: #f2efe8; --code: #1d2636;
    --draft-bg: #3b300f; --draft-text: #f2cd6b;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 1rem; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--link); text-decoration-color: var(--accent); text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
header {
  border-top: 4px solid var(--text); border-bottom: 1px solid var(--border);
  background: var(--surface); padding: 1.1rem 16px;
}
.masthead {
  max-width: 76rem; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 0.9rem 1.5rem;
}
.brand { display: flex; align-items: center; gap: 0.8rem; }
.brand img { width: 44px; height: 44px; flex: none; display: block; }
.brand h1 { font-size: 1.4rem; line-height: 1.2; margin: 0; }
.brand p { margin: 0.1rem 0 0; color: var(--muted); font-size: 0.92rem; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 0.8rem; font-size: 0.85rem; }
.meta .spec { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.5rem; }
.meta .draft { background: var(--draft-bg); color: var(--draft-text); border-radius: 4px; padding: 0.2rem 0.55rem; font-weight: 600; }
.meta time { color: var(--muted); }
.source {
  display: inline-flex; align-items: center; gap: 0.45rem; background: var(--text); color: var(--bg);
  text-decoration: none; font-weight: 600; border-radius: 6px; padding: 0.55rem 0.9rem;
}
.source:hover { opacity: 0.9; text-decoration: none; }
.tabs { max-width: 76rem; margin: 0.9rem auto -1.1rem; display: flex; gap: 1.4rem; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.95rem; padding: 0.3rem 0 0.7rem; border-bottom: 3px solid transparent; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
.layout {
  max-width: 76rem; margin: 0 auto; padding: 0 16px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 3rem;
}
nav.side { display: none; }
nav ol { list-style: none; margin: 0; padding: 0; }
nav ol ol { padding-left: 1rem; }
nav li { margin: 0.3rem 0; line-height: 1.35; }
nav a { text-decoration: none; color: var(--muted); font-size: 0.92rem; }
nav a:hover { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); }
details.toc { margin: 1.5rem 0 0; border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.9rem; }
details.toc summary { cursor: pointer; font-weight: 600; }
details.toc ol { margin-top: 0.6rem; }
main { min-width: 0; max-width: 48rem; padding-bottom: 4rem; }
main h2 { margin-top: 2.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); font-size: 1.5rem; }
main h3 { margin-top: 2rem; font-size: 1.18rem; }
main h2:first-of-type { border-top: none; margin-top: 1.8rem; padding-top: 0; }
.header-anchor { margin-left: 0.4rem; text-decoration: none; color: var(--muted); opacity: 0; }
h2:hover .header-anchor, h3:hover .header-anchor, .header-anchor:focus { opacity: 1; }
code {
  font: 0.88em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  background: var(--code); padding: 0.1em 0.3em; border-radius: 4px; overflow-wrap: anywhere;
}
pre { background: var(--code); padding: 1rem; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
.table { overflow-x: auto; margin: 1.2rem 0; }
table { border-collapse: collapse; font-size: 0.9rem; line-height: 1.45; min-width: 32rem; }
th, td { border: 1px solid var(--border); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
th { background: var(--surface); }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 0.9rem; padding: 1.5rem 16px; text-align: center; }
@media (min-width: 64rem) {
  .layout { grid-template-columns: 17rem minmax(0, 1fr); }
  nav.side {
    display: block; position: sticky; top: 0; align-self: start;
    max-height: 100vh; overflow-y: auto; padding: 1.5rem 0 2rem;
  }
  nav.side h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.6rem; }
  details.toc { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <div class="brand">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="sheaf-dark.svg">
        <img src="sheaf.svg" alt="" width="44" height="44">
      </picture>
      <div>
        <h1>Sheaf</h1>
        <p>Evidence dossier standard</p>
      </div>
    </div>
    <div class="meta">
      <code class="spec">$spec</code>
      <span class="draft" title="$note">Draft $draft</span>
      <time datetime="$updated_iso">Updated $updated</time>
      <a class="source" href="$repository">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Source on GitHub
      </a>
    </div>
  </div>
  <nav class="tabs" aria-label="Pages">
$tabs
  </nav>
</header>
<div class="layout">
  <nav class="side" aria-label="Contents">
    <h2>Contents</h2>
    <ol>
$contents
    </ol>
  </nav>
  <main>
    <details class="toc">
      <summary>Contents</summary>
      <nav aria-label="Contents">
        <ol>
$contents
        </ol>
      </nav>
    </details>
$body
  </main>
</div>
<footer>
  Apache License 2.0 · <a href="$repository/blob/main/docs/$source">Edit on GitHub</a>
</footer>
</body>
</html>
