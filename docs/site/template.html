<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheaf standard</title>
<meta name="description" content="$title. An open standard for evidence records of AI agents and automated workflows.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #fbfaf7; --surface: #f2efe8; --text: #1b2a41; --muted: #5a6577;
  --border: #ddd8cc; --accent: #e0a100; --link: #1b2a41; --code: #efebe2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11161f; --surface: #182030; --text: #e8e4da; --muted: #9aa3b2;
    --border: #2a3342; --accent: #e0a100; --link: #f2efe8; --code: #1d2636;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 1rem; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--link); text-decoration-color: var(--accent); text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
header {
  border-bottom: 1px solid var(--border); background: var(--surface);
  padding: 1.25rem 16px;
}
.masthead { max-width: 76rem; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
.masthead img { width: 56px; height: 56px; flex: none; }
.masthead h1 { font-size: 1.35rem; line-height: 1.3; margin: 0; }
.masthead p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.95rem; }
.layout {
  max-width: 76rem; margin: 0 auto; padding: 0 16px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 3rem;
}
nav.side { display: none; }
nav ol { list-style: none; margin: 0; padding: 0; }
nav ol ol { padding-left: 1rem; }
nav li { margin: 0.3rem 0; line-height: 1.35; }
nav a { text-decoration: none; color: var(--muted); font-size: 0.92rem; }
nav a:hover { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); }
details.toc { margin: 1.5rem 0 0; border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.9rem; }
details.toc summary { cursor: pointer; font-weight: 600; }
details.toc ol { margin-top: 0.6rem; }
main { min-width: 0; max-width: 48rem; padding-bottom: 4rem; }
main h2 { margin-top: 2.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); font-size: 1.5rem; }
main h3 { margin-top: 2rem; font-size: 1.18rem; }
.header-anchor { margin-left: 0.4rem; text-decoration: none; color: var(--muted); opacity: 0; }
h2:hover .header-anchor, h3:hover .header-anchor, .header-anchor:focus { opacity: 1; }
code {
  font: 0.88em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  background: var(--code); padding: 0.1em 0.3em; border-radius: 4px; overflow-wrap: anywhere;
}
pre { background: var(--code); padding: 1rem; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
.table { overflow-x: auto; margin: 1.2rem 0; }
table { border-collapse: collapse; font-size: 0.9rem; line-height: 1.45; min-width: 32rem; }
th, td { border: 1px solid var(--border); padding: 0.45rem 0.6rem; text-align: left; vertical-align: top; }
th { background: var(--surface); }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 0.9rem; padding: 1.5rem 16px; text-align: center; }
@media (min-width: 64rem) {
  .layout { grid-template-columns: 17rem minmax(0, 1fr); }
  nav.side {
    display: block; position: sticky; top: 0; align-self: start;
    max-height: 100vh; overflow-y: auto; padding: 1.5rem 0 2rem;
  }
  nav.side h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 0.6rem; }
  details.toc { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="masthead">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="sheaf-dark.svg">
      <img src="sheaf.svg" alt="Sheaf logo" width="56" height="56">
    </picture>
    <div>
      <h1>$title</h1>
      <p>Spec id <code>sheaf/1</code> · <a href="$repository">Source and reference implementation on GitHub</a></p>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="side" aria-label="Contents">
    <h2>Contents</h2>
    <ol>
$contents
    </ol>
  </nav>
  <main>
    <details class="toc">
      <summary>Contents</summary>
      <nav aria-label="Contents">
        <ol>
$contents
        </ol>
      </nav>
    </details>
$body
  </main>
</div>
<footer>
  Apache License 2.0 · <a href="$repository/blob/main/docs/standard.md">Edit on GitHub</a>
</footer>
</body>
</html>
