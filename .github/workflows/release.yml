name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Changes that cannot alter the image do not rebuild it. GitHub does not apply path filters
    # to tag pushes, so a version tag always publishes.
    paths-ignore:
      - docs/**
      - README.md
      - CLAUDE.md
      - LICENSE
      - .github/dependabot.yml
      - .github/workflows/ci.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the tag legs cut a GitHub Release
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Image names must be lower case; the repository name need not be.
      - name: Name the image
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for the arm64 leg)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long
            type=edge,branch=main

      - name: Commit time
        id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # The digest is what a mandate records (standard 5.6, 7.1), so it must be rebuildable from
      # the commit: file times come from the commit, and buildx's own provenance and SBOM stay
      # out of the image index, where their build times would change the digest. Provenance is
      # attached beside the image instead, by the attestation step below.
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # The storage record feeds GitHub's organisation artifact view, which is not used; it
          # would need another write permission. The signed provenance does not depend on it.
          create-storage-record: false

      # Only version tags get a Release; pushes to main just move :edge.
      # Re-runnable: an existing Release for the tag is updated, not duplicated.
      - name: Cut the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EPOCH: ${{ steps.epoch.outputs.value }}
        run: |
          set -euo pipefail
          {
            echo "## Container image"
            echo
            echo "One image for the gateway and the witness job, built for \`linux/amd64\` and"
            echo "\`linux/arm64\`, with build provenance attached."
            echo
            echo '```'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "A mandate records this digest as \`gateway.image\`. To rebuild it from this tag:"
            echo
            echo '```'
            echo "docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \\"
            echo "  --build-arg SOURCE_DATE_EPOCH=${EPOCH} \\"
            echo "  --output type=image,name=sheaf:rebuild,rewrite-timestamp=true ."
            echo '```'
          } > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              --generate-notes \
              --verify-tag
          fi
