[project]
name = "sheaf-witness"
version = "0.1.0"
description = "The Sheaf witness: signs the chain head and has it time-stamped by independent authorities (standard 7.2 step 5, 7.5)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-keyvault-keys>=4.12.0",
    "azure-storage-blob>=12.31.1",
    "httpx>=0.27",
    "sheaf-core",
]

[tool.uv.sources]
sheaf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf_witness"]
