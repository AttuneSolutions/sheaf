[project]
name = "sheaf-core"
version = "0.1.0"
description = "Canonical form, digests and chain rules for the Sheaf evidence dossier standard. No Azure dependencies."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=50.0.2",
    "jsonschema>=4.23",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf_core"]
