[project]
name = "sheaf-gateway"
version = "0.1.0"
description = "The Sheaf write gateway: validates every artefact and entry, then commits it to the chain (standard section 7)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "azure-storage-blob>=12.31.1",
    "certifi>=2026.10.23",
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.8",
    "sheaf-core",
    "urllib3>=2.8.0",
    "uvicorn>=0.32",
]

[tool.uv.sources]
sheaf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf_gateway"]
