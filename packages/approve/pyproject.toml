[project]
name = "sheaf-approve"
version = "0.1.0"
description = "The Sheaf approval service: a person approves a staged mandate change in their own browser, with their own sign-in (standard 7.6)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "sheaf-core",
    "uvicorn>=0.32",
]

[project.scripts]
sheaf-approve = "sheaf_approve.__main__:main"

[tool.uv.sources]
sheaf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf_approve"]
