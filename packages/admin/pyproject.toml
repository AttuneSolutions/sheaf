[project]
name = "sheaf-admin"
version = "0.1.0"
description = "What a tenant's people run against the Sheaf gateway: stage a mandate change, and approve one (standard 5.6, 7.6)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "azure-identity>=1.27.0",
    "httpx>=0.27",
    "sheaf-core",
    "sheaf-witness",
]

[project.scripts]
sheaf-admin = "sheaf_admin.__main__:main"

[tool.uv.sources]
sheaf-core = { workspace = true }
sheaf-witness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheaf_admin"]
